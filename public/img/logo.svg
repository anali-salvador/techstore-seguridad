<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TechStore">
  <!-- Logo de TechStore: escudo con candado (seguridad) en degradado azul-violeta-turquesa -->
  <defs>
    <linearGradient id="degradado" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Escudo -->
  <path d="M32 4 10 12v18c0 14 9.4 25.6 22 30 12.6-4.4 22-16 22-30V12z" fill="url(#degradado)"/>
  <!-- Brillo en la mitad izquierda -->
  <path d="M32 4 10 12v18c0 14 9.4 25.6 22 30z" fill="#fff" opacity="0.14"/>
  <!-- Candado -->
  <path d="M26 30v-4.5a6 6 0 0 1 12 0V30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <rect x="22" y="29" width="20" height="15" rx="3.5" fill="#fff"/>
  <circle cx="32" cy="35.5" r="2.2" fill="#4f46e5"/>
  <rect x="31" y="36" width="2" height="4.5" rx="1" fill="#4f46e5"/>
</svg>
