<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Registro</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="card">
    <h1>Crear cuenta</h1>
    <form id="form-registro" novalidate>
      <label for="nombre">Nombre completo</label>
      <input id="nombre" name="nombre" autocomplete="name" required>

      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <!-- Lista de reglas que se marcan en vivo mientras se escribe -->
      <ul id="reglas" class="reglas">
        <li data-regla="largo">Mínimo 8 caracteres</li>
        <li data-regla="mayuscula">Una letra mayúscula</li>
        <li data-regla="numero">Un número</li>
        <li data-regla="especial">Un carácter especial (!@#$%...)</li>
      </ul>

      <label for="tienda">Tienda asignada</label>
      <select id="tienda" name="tienda" required>
        <option value="">-- Selecciona una tienda --</option>
      </select>

      <button type="submit">Registrarme</button>
    </form>
    <div id="mensaje" class="msg" hidden></div>
    <p class="enlaces">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
  </main>
  <script src="/js/comun.js"></script>
  <script src="/js/registro.js"></script>
</body>
</html>
